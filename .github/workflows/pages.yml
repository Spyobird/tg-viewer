name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest
      - name: Build static site
        run: |
          mkdir -p _site/tg_viewer
          cp src/tg_viewer/*.py _site/tg_viewer/
          sed 's/^const STATIC_SITE = false;/const STATIC_SITE = true;/' src/tg_viewer/static/index.html > _site/index.html
          grep -q '^const STATIC_SITE = true;' _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
